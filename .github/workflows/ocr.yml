# Convert again, on 20 GitHub runners in parallel, the papers whose text on the site is missing or cut
# short: scanned PDFs get full-page OCR, long PDFs (books) every page. See scripts/ocr_gh.
#
# Started by hand (Actions -> OCR papers -> Run workflow) or by a commit that changes
# scripts/ocr_gh/run.json. The repository is public: paper text only travels encrypted (ARTIFACT_KEY)
# and is never printed. The keys come from the site, which hands them to this workflow only
# (scripts/ocr_gh/keys.sh: GitHub's OIDC token proves which workflow asks).
name: OCR papers

on:
  workflow_dispatch:
    inputs:
      only:
        description: "doc_ids, comma-separated (empty: check every paper)"
        default: ""
      dry:
        description: "Only report, do not change the site"
        type: boolean
        default: false
      from_run:
        description: "Only the replace step, with the plan and conversions of this earlier run (kept 3 days)"
        default: ""
  push:
    paths: [scripts/ocr_gh/run.json]

permissions:
  contents: write
  id-token: write
  actions: read

concurrency: ocr

env:
  GH_TOKEN: ${{ github.token }}
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TQDM_DISABLE: "1"
  PYTHONPATH: ${{ github.workspace }}/scripts/ocr_gh
  SHARDS: "20"

jobs:
  scan:
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      dry: ${{ steps.args.outputs.dry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Keys
        run: bash scripts/ocr_gh/keys.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.11", cache: pip}
      - name: Install
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e ".[ocr]"
      - name: Arguments
        id: args
        # the inputs come in through the environment, never pasted into the script (a value with $(…) or a quote
        # would run as shell)
        env:
          EVENT: ${{ github.event_name }}
          ONLY_IN: ${{ inputs.only }}
          DRY_IN: ${{ inputs.dry }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ONLY="$ONLY_IN"; DRY="$DRY_IN"
          else
            ONLY=$(jq -r '.only // ""' scripts/ocr_gh/run.json); DRY=$(jq -r '.dry // false' scripts/ocr_gh/run.json)
          fi
          # one line: a newline would add outputs of its own to $GITHUB_OUTPUT
          [[ "$ONLY" != *$'\n'* && "$ONLY" != *$'\r'* ]] || { echo "only: doc_ids, comma-separated, on one line"; exit 1; }
          [[ "$DRY" == "true" ]] || DRY=false
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"; echo "dry=$DRY" >> "$GITHUB_OUTPUT"
      - name: Extra PDFs (encrypted assets of the draft release ocr-inputs)
        run: bash scripts/ocr_gh/fetch_inputs.sh
      - name: Plan
        id: plan
        env:
          ONLY: ${{ steps.args.outputs.only }}
        run: |
          python scripts/ocr_gh/scan.py "$SHARDS" ${ONLY:+--only "$ONLY"}
          echo "shards=$(jq -c '[.units[].shard] | unique' plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: plan, path: plan.json, retention-days: 7}

  convert:
    needs: scan
    if: needs.scan.result == 'success' && needs.scan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Keys
        run: bash scripts/ocr_gh/keys.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.11", cache: pip}
      - name: Install
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e ".[ocr]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: plan}
      - name: Extra PDFs
        run: bash scripts/ocr_gh/fetch_inputs.sh
      - name: Convert
        run: python scripts/ocr_gh/convert.py ${{ matrix.shard }} 2>&1 | grep -vE "Warning|warn\(" || true
      - name: Encrypt
        if: always()
        run: |
          mkdir -p units && tar czf - units | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY -out units-${{ matrix.shard }}.enc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: "units-${{ matrix.shard }}", path: "units-${{ matrix.shard }}.enc", retention-days: 3}

  replace:
    needs: [scan, convert]
    if: always() && (inputs.from_run || (needs.scan.result == 'success' && needs.scan.outputs.shards != '[]'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Keys
        run: bash scripts/ocr_gh/keys.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.11", cache: pip}
      - name: Install
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e ".[ocr]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*"
          merge-multiple: true
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Decrypt
        run: |
          for f in units-*.enc; do openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ARTIFACT_KEY -in "$f" | tar xzf -; done
          ls units | wc -l
      - name: Replace on the site
        env:
          DRY: ${{ needs.scan.outputs.dry == 'true' || inputs.dry }}
        run: |
          python scripts/ocr_gh/replace.py $([ "$DRY" = "true" ] && echo --dry) 2>&1 | grep -vE "Warning|warn\(" || true
          test -f report.json
      - name: Save the report and the list of replaced papers
        env:
          RUN: ${{ inputs.from_run || github.run_id }}
        run: |
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "from_run: a run id (digits)"; exit 1; }
          mkdir -p scripts/ocr_gh/reports && cp report.json "scripts/ocr_gh/reports/$RUN.json"
          git config user.name "ocr workflow"; git config user.email "actions@users.noreply.github.com"
          git add scripts/ocr_gh/reports data/rag-optics/external_points.txt
          git commit -qm "OCR workflow: report of run $RUN" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
