# Properties of the crystals that the crystal advisor (phase-matching tab) uses besides the indices and d:
# transparency: the transmission range as the source states it, with its level ("0": the edges where the
# transmission vanishes; α = 1 cm⁻¹, 0.5 for a crystal of the given length: narrower). Read from Nikogosyan,
# Nonlinear Optical Crystals: A Complete Survey (2005), doc_id 10.1007_b138685; pdf_page is the page of the PDF.
# hygroscopic: none, slight, yes or strong (used heated or sealed), only where a source says so, with its sentence;
# sources sometimes disagree (LBO), and the sentence says so.
# notes: what a user must know before buying (the warning in Persian and English for the site, the paper's sentence).
# damage: one representative laser-damage threshold with its wavelength and pulse, and the sentence; thresholds
# depend strongly on pulse length, beam size, surface and crystal quality, so read it as an order of magnitude.
# min_pump_um: the shortest wavelength the crystal tolerates (two-photon or residual absorption), with its sentence.
# thermal_conductivity: W/(m·K), with its sentence.
# class: how established the crystal is: the chapter of Nikogosyan (2005) that holds it (basic, main-ir, often, poled,
# new, sfd, rare), or newer for crystals developed since that a later review treats as established.

