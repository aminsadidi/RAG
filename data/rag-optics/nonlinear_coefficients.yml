# Second-order nonlinear coefficients d_il (pm/V, SHG of about 1.064 µm unless noted), read from papers
# of the collection, for the d_eff of the site's phase-matching tab.
#
# `d` lists every nonzero element in contracted notation (l: 1 = xx, 2 = yy, 3 = zz, 4 = yz, 5 = xz,
# 6 = xy), in the frame of the crystal's dispersion formulas: for a uniaxial crystal z is the optic
# axis; for a biaxial crystal x, y, z are the principal axes with nx < ny < nz. Elements that the
# point-group symmetry or Kleinman symmetry make equal to a measured one are written out and marked
# in `notes`. The site computes d_eff = Σ e3_i d_ijk e1_j e2_k from the field directions of the three
# waves, so no d_eff formula has to be chosen by hand.
#
# Frames of biaxial crystals differ between papers (KTP's d31/d32 and d15/d24 are swapped in part of
# the literature). The frames below are fixed by measured d_eff values of phase-matched SHG reported
# in the collection; tests in web/test/phasematch.test.js recompute them.

- material: BaB2O4
  point_group: 3m
  d: {22: 2.2, 21: -2.2, 16: -2.2, 31: 0.1, 32: 0.1, 15: 0.1, 24: 0.1}
  sources:
    - {doc_id: 10.1109_3.55534, cite: "Eckardt et al. (1990)", pdf_page: 10, what: "|d22| = 2.2 pm/V (Table III), from the measured d_eff = 1.94 pm/V of type-I SHG at 1.064 µm"}
    - {doc_id: 10.1109_3.159516, cite: "Roberts (1992)", pdf_page: 13, what: "d31 = 0.1 pm/V and the relative sign d21 = −d22 (Table VI)"}
  notes: "3m: d21 = d16 = −d22, d31 = d32 = d15 = d24; d33 is not needed for the o/e interactions and is left out"

