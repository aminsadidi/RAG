  sources:
    - {doc_id: 10.1364_josab.14.002268, cite: "Shoji et al. (1997)", pdf_page: 14, what: "5% MgO:LiNbO3, |d33| = 25.0, |d31| = 4.4 pm/V at 1.064 µm (Table 10)"}
    - {doc_id: 10.1109_3.159516, cite: "Roberts (1992)", pdf_page: 13, what: "d22 = 2.1 pm/V of congruent LiNbO3 and the signs (Table VI)"}
