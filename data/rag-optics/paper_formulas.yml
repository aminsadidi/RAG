# Dispersion data read from papers of the collection, for crystals the refractiveindex.info database
# does not have (KTA/RTA/CTA, CBO, KBBF, CdSiP2, YCOB/GdCOB/TmCOB, LCB, DAST/DSTMS, LiInS2, LiInSe2).
#
# Every value was read from the paper itself (the PDF page given in `pdf_page`; equations that the
# text extraction lost were read from the page image), never from memory. `checks` are values the
# same paper reports (its "calculated" columns, its reference indices, phase-matching angles, ...);
# tests/test_paper_formulas.py recomputes them, so a mistyped coefficient fails the tests.
#
# Formula types are those of refractiveindex.info (src/matrag/dispersion.py), plus
# type 10: n² = C1 + C2·λ^C3/(λ^C3 − C4) + C5·λ^C6/(λ^C6 − C7)  (poles with free exponents, Fève 2000).
# A "tab" entry is a table of measured indices as printed in the paper.

