  doc_id: 10.1364_ao.53.001063
  cite: "Katō, Petrov, Umemura (2014)"
  pdf_page: 4
  where: "Eq. (4), 1.0642–10.591 µm; the Sellmeier equations of Eq. (1) are at 25 °C"
  t0_c: 25
  form: kato
  axes:
    x: [{range_um: [1.0642, 10.591], terms: [[0.7242, -3], [-0.9339, -2], [1.7224, -1], [3.9593, 0]]}]
    y: [{range_um: [1.0642, 10.591], terms: [[1.4136, -3], [-2.0858, -2], [2.4430, -1], [7.4585, 0]]}]
    z: [{range_um: [1.0642, 10.591], terms: [[0.9988, -3], [-1.3402, -2], [1.9607, -1], [5.3949, 0]]}]

- material: LiB3O5
  source: Ghosh-1995
  doc_id: 10.1063_1.360499
  cite: "Ghosh (1995)"
  pdf_page: 4
  where: "Table II (G, H, λig) and Eqs. (7), (8): G of y and H of z vary with T; the paper's model reproduces the measured NCPM temperatures to ±4 °C"
  t0_c: 20
  form: ghosh
  axes:
    x: {lig_um: 0.0530, G: [-127.70167], H: [122.13435]}
    y: {lig_um: 0.0327, G: [372.170, -2.199e-1, 1.1748e-3, -2.05077e-6], H: [-415.10435]}
    z: {lig_um: 0.0435, G: [-446.95031], H: [410.66123, 1.667e-1, -5.1887e-4, 5.56251e-7]}

