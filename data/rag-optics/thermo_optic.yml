# Temperature dependence of the principal indices, read from papers of the collection, for the
# phase-matching tab (temperature input and noncritical phase-matching temperatures).
#
# Each block applies to one source of the crystal (`source`: the page label of its Sellmeier
# equations, the same paper's unless `where` says otherwise) and gives n(λ, T) = n(λ, t0) + Δn(λ, T):
#   form "kato":  dn/dT = Σ c·λ^p × 10⁻⁵ /°C, constant in T, so Δn = (T − t0)·dn/dT; `pieces` cover
#                 wavelength ranges (outside them the nearest piece is used).
#                 A piece may carry t_coef (and t_coef2): dn/dT = (Σ c·λ^p)(1 + t_coef·ΔT + t_coef2·ΔT²) × 10⁻⁵,
#                 integrated from t0.
#                 A piece may carry t_terms: dn/dT = (Σ c·λ^p + T·Σ c'·λ^p) × 10⁻⁵ with T in kelvin, integrated
#                 from t0 (Xu et al. 2014).
#   form "sellmeier": n² = A + B/(λ² − C) − D·λ² with each coefficient linear in T − t0 (c and dc).
#   form "gayer": Gayer et al. (2008) / Dolev et al. (2009), coefficients times f = (T − t0)(T + t0 + 546.32):
#                 n² = a0 + b0·f + (a1 + b1·f)/(λ² − (a2 + b2·f)²) + (a3 + b3·f)/(λ² − (a4 + b4·f)²) − a5·λ²;
#                 f_c replaces 546.32 (Edwards & Lawrence 1984 write 546).
#   form "bhar":  n² = A + B/(1 − C/λ²) + D/(1 − E/λ²) with A, B, C, D = m·T + c (T in °C) and E constant
#                 (Bhar & Ghosh 1979); Δn = n(T) − n(t0) of that equation. kelvin: true when T is in K.
#   form "skauli": n² = g0 + Σ gi/(λi⁻² − λ⁻²), i = 1..3, every gi and λi a polynomial in T − t0 (coefficients of
#                 ΔT⁰, ΔT¹, ΔT²), Skauli et al. (2003).
#   form "wei":   n² = A(T) + B(T)/(λ² − C) + D(T)/(λ² − E), A, B, D quadratic in T in kelvin (Wei et al. 2018).
#   form "mangin": (1/n)dn/dT = (c0 + c1·T) × 10⁻⁶ (T in °C), each c = [a + b/(λ² − C) + d/(λ² − E) + e/(λ² − E)²]/(2n0²)
#                 with [a, b, d, e] given; n(T) = n0·exp(∫ from t0) (Mangin et al. 2009).
#   form "ghosh": 2n·dn/dT = G·R + H·R², R = λ²/(λ² − λig²), G and H (10⁻⁶ /°C) polynomials in T (°C),
#                 integrated from t0 (Ghosh 1995, Eqs. 2, 3, 7, 8).
#   form "phillips": dn/dT = −c·(n² + a·n + b), constant in T, n the index at t0 (Phillips 1966, Eqs. 7–9).
#   form "emanueli": Δn = n1·ΔT + n2·ΔT², n1 = Σ a_m/λ^m × 10⁻⁶, n2 = Σ b_m/λ^m × 10⁻⁸ (m = 0..3); `corr` adds
#                 B(λ − λ0)/(1 + exp(−γ(λ − λ0))) to n1 (B1, 10⁻⁶) and n2 (B2, 10⁻⁹) (Emanueli & Arie 2003, Eqs. 2–4).
#   form "pomeroy": n² = a0 + a1T² + (b0 + b1T²)/(λ² − (c0 + c1T² + c2T⁴)) − dλ², T in K, c = [a0, a1, b0, b1, c0, c1, c2, d]
#                 (Pomeroy 1971); Δn = n(T) − n(t0) of that equation.
#   form "oscillator": ε = ε∞ + Σ Δεi·νi²/(νi² − ν² + iΓi·ν), ν in cm⁻¹, with νi, Δεi and Γi/νi quadratic in
#                 T − T0 (K); modes [ν, a1, a2, Δε, b1, b2, Γ/ν, c1, c2] (Thomas et al. 1998); Δn = Re n(T) − Re n(t0).
#   form "rams":  n² = A + B/(λ0(T)⁻² − λ⁻²) + (c0 + c1·T)λ², λ0 = p0 + p1·T + p2·T² (λ, λ0 in nm, T in °C; Rams et al. 1997);
#                 Δn = n(T) − n(t0) of that equation.
#   form "uchida": (1/n)(dn/dT)·n²/(n² − 1) = −Δ·λ²/(λ² − λ1²) + Ω/2 (single-oscillator model, Uchida 1971), constant in T.
# partial: true marks a paper that measured only some of the axes; the others keep their t0 index.
# Every value was read from the PDF page given; the tests (web/test/phasematch.test.js) recompute the
# phase-matching temperatures the papers report.

