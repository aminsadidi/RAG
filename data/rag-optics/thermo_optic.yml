# Temperature dependence of the principal indices, read from papers of the collection, for the
# phase-matching tab (temperature input and noncritical phase-matching temperatures).
#
# Each block applies to one source of the crystal (`source`: the page label of its Sellmeier
# equations, the same paper's) and gives n(λ, T) = n(λ, t0) + Δn(λ, T):
#   form "kato":  dn/dT = Σ c·λ^p × 10⁻⁵ /°C, constant in T, so Δn = (T − t0)·dn/dT; `pieces` cover
#                 wavelength ranges (outside them the nearest piece is used).
#                 A piece may carry t_coef: dn/dT = (Σ c·λ^p)(1 + t_coef·ΔT) × 10⁻⁵, integrated from t0.
#   form "sellmeier": n² = A + B/(λ² − C) − D·λ² with each coefficient linear in T − t0 (c and dc).
#   form "gayer": Gayer et al. (2008) / Dolev et al. (2009), coefficients times f = (T − t0)(T + t0 + 546.32):
#                 n² = a0 + b0·f + (a1 + b1·f)/(λ² − (a2 + b2·f)²) + (a3 + b3·f)/(λ² − (a4 + b4·f)²) − a5·λ²;
#                 f_c replaces 546.32 (Edwards & Lawrence 1984 write 546).
#   form "bhar":  n² = A + B/(1 − C/λ²) + D/(1 − E/λ²) with A, B, C, D = m·T + c (T in °C) and E constant
#                 (Bhar & Ghosh 1979); Δn = n(T) − n(t0) of that equation. kelvin: true when T is in K.
#   form "ghosh": 2n·dn/dT = G·R + H·R², R = λ²/(λ² − λig²), G and H (10⁻⁶ /°C) polynomials in T (°C),
#                 integrated from t0 (Ghosh 1995, Eqs. 2, 3, 7, 8).
# Every value was read from the PDF page given; the tests (web/test/phasematch.test.js) recompute the
# phase-matching temperatures the papers report.

