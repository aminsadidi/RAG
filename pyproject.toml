[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "matrag"
version = "0.1.0"
description = "RAG system for retrieving and extracting physical properties of materials from scientific papers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.130",
    "llama-index-core>=0.14.25",
    "llama-index-vector-stores-chroma>=0.6",
    "llama-index-embeddings-huggingface>=0.8",
    "llama-index-llms-google-genai>=0.11",
    "llama-index-llms-ollama>=0.11",
    "llama-index-retrievers-bm25>=0.8",
    "chromadb>=1.5",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pylatexenc>=2.10",
    "typer>=0.26",
    "gradio>=6.0",
    "pandas>=2.0",
    "hitran-api>=1.2",
    "plotly>=5.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Full-page OCR of scanned papers (MATRAG_FORCE_OCR, data/<corpus>/ocr_papers.txt).
ocr = ["rapidocr>=3", "onnxruntime>=1.18"]

[project.scripts]
matrag = "matrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matrag = ["profiles/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
