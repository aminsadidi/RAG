# Group A: Thermo-optic dispersion (dn/dT) for crystals that have refractive-index data but no temperature data
# Extracted strictly from PDFs in RAG-Optics / 01_Papers_by_Category

- material: KTiOAsO4
  quantity: dn/dT
  axis: x
  file: not_found
  pdf_page: null
  where: not_found
  formula: not_found
  values: {}
  units: not_found
  range: {wavelength_um: not_found, temperature_c: not_found}
  check: not_found
  note: "x-axis thermo-optic dispersion coefficients are not reported in the collection PDFs (only y and z axes are given in 10.1364-ao.42.006661.pdf)."

- material: KTiOAsO4
  quantity: dn/dT
  axis: y
  file: 10.1364-ao.42.006661.pdf
  pdf_page: 3
  where: "Table 2, KTA y-axis columns n1 and n2"
  formula: "Δn(λ,T) = n1(λ)(T − 25 °C) + n2(λ)(T − 25 °C)², n1 = Σ a_m/λ^m, n2 = Σ b_m/λ^m"
  values:
    n1: {a0: -4.1053, a1: 44.261, a2: -38.012, a3: 11.302}
    n2: {b0: 0.5857, b1: 3.9386, b2: -4.0081, b3: 1.4316}
  units: "n1 in 1e-6 /°C, n2 in 1e-8 /°C², λ in µm"
  range: {wavelength_um: [0.532, 1.585], temperature_c: [25, 200]}
  check: "Fig. 4: n1(y) ≈ 1.37e-5 /°C at 1.064 µm"
  note: "Emanueli & Arie (2003) Table 2: KTA y-axis"

- material: KTiOAsO4
  quantity: dn/dT
  axis: z
  file: 10.1364-ao.42.006661.pdf
  pdf_page: 3
  where: "Table 2, KTA z-axis columns n1 and n2"
  formula: "Δn(λ,T) = n1(λ)(T − 25 °C) + n2(λ)(T − 25 °C)², n1 = Σ a_m/λ^m, n2 = Σ b_m/λ^m"
  values:
    n1: {a0: -6.1537, a1: 64.505, a2: -56.447, a3: 17.169}
    n2: {b0: -0.96751, b1: 13.192, b2: -11.78, b3: 3.6292}
  units: "n1 in 1e-6 /°C, n2 in 1e-8 /°C², λ in µm"
  range: {wavelength_um: [0.532, 1.585], temperature_c: [25, 200]}
  check: "Fig. 4: n1(z) ≈ 3.45e-5 /°C at 1.064 µm"
  note: "Emanueli & Arie (2003) Table 2: KTA z-axis. With mid-IR correction of Eq. (4) for OPO."

- material: GaN
  quantity: dn/dT
  axis: o
  file: 10.1063-1.3021148.pdf
  pdf_page: 4
  where: "Eq. (2) and Table I"
  formula: "∂n_o/∂T = A/λ³ + B/λ² + C/λ + D"
  values: {A: 4.247e4, B: -1.592e2, C: 2.187e-1, D: -3.427e-5}
  units: "∂n_o/∂T in K⁻¹, λ in nm"
  range: {wavelength_um: [0.370, 0.500], temperature_c: [20, 40]}
  check: "∂n_o/∂T = (1.53 ± 0.14)e-4 K⁻¹ at λ = 441.6 nm, T = 20–40 °C (p. 4, col. 1)"
  note: "Measured on wurtzite GaN epilayer by spectroscopic interferometry."

