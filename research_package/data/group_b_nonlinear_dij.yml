# Group B: Second-order nonlinear coefficients d_ij (pm/V) for crystals that have none
# Extracted strictly from PDFs in RAG-Optics / 01_Papers_by_Category

- material: BaTiO3
  quantity: d_ij
  axis: "-"
  file: 2013_Joulaud_Characterization_of_the_nonlinear_optical_properties_of_nanocrystals_b_0cfdeb.pdf
  pdf_page: 4
  where: "Table 1, row BaTiO3 and formula footnote"
  formula: "⟨d²⟩ = (6/35)·d33² + (32/105)·d31·d33 + (92/105)·d31²"
  values: {point_group: "4mm", d_mean_mono_pm_v: 5.5, d_mean_bulk_lit_pm_v: 14.1, d33: not_found, d31: not_found, d15: not_found}
  units: "pm/V"
  range: {wavelength_um: [1.064, 1.064], temperature_c: not_found}
  check: "Table 1: ⟨d_bulk⟩ = 14.1 pm/V cited from Nikogosyan 2005; ⟨d_mono⟩ = 5.5 pm/V measured at 1064 nm"
  note: "Individual tensor elements d33, d31, d15 for bulk single crystals are not found in collection PDFs (only orientational-average ⟨d⟩ reported). Kleinman symmetry assumed in effective powder/NC formulas."

