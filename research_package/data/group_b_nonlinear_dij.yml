  where: "p. 3, col. 1, Eq. (4) and text"
  formula: "d31 ≈ (1/2)·|χ(2)_31|"
  values: {point_group: "6mm", d31: 4.25}
  units: "pm/V"
  range: {wavelength_um: [1.064, 1.064], temperature_c: not_found}
  check: "|χ(2)_31| ≈ 8.5 pm/V, |χ(2)_33| ≈ 24 pm/V for 4H-SiC at 1064 nm"
  note: "For 3C-SiC (point group -43m), 10.1103-physrevb.57.3905.pdf Table IV reports χ123 = 17.6 pm/V (d14 = 8.8 pm/V). Kleinman symmetry assumed."

