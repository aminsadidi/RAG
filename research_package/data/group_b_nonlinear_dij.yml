- material: TeO2
  quantity: d_ij
  axis: "-"
  file: not_found
  pdf_page: null
  where: not_found
  formula: "d_ij ≡ 0 under Kleinman symmetry"
  values: {point_group: "422", d14: not_found}
  units: not_found
  range: {wavelength_um: not_found, temperature_c: not_found}
  check: not_found
  note: "TeO2 paratellurite belongs to point group 422 where the only non-zero component is d14 = -d25. Under Kleinman symmetry, d14 = d123 = d213 = -d14 = 0, so d_ij vanishes identically. Kleinman-forbidden experimental values (|d14| ≈ 0.4 pm/V) are not found in the collection."

- material: BaGa2GeSe6
  quantity: d_ij
  axis: "-"
  file: 10.1109-lpt.2024.3457910.pdf
  pdf_page: 2
  where: "Section II, column 1, Eq. (1)-(2) and text"
  formula: "d_eff(type-I) = (d11·sin 3ϕ + d22·cos 3ϕ)·cos²θ; d_eff(type-II) = (d11·cos 3ϕ − d22·sin 3ϕ)·cos θ + d31·sin θ"
  values: {point_group: "3", d11: 23.6, d22: -18.5, d31: 18.3}
  units: "pm/V"
  range: {wavelength_um: [1.064, 1.064], temperature_c: not_found}
  check: "Citing Kato et al. 2020 (Opt. Lett. 45, 2136)"
  note: "Measured via phase-matched SHG/SFG. Kleinman symmetry assumed: d16 = -d22, d15 = d31."

- material: CuGaS2
  quantity: d_ij
  axis: "-"
  file: 10.1109-jqe.1971.1076588.pdf
  pdf_page: 7
  where: "Table V, row CuGaS2"
  formula: "(2·d14 + d36)/3 = d36 (under Kleinman symmetry)"
  values: {point_group: "-42m", d36: 14.5, ratio_to_GaAs: 0.108}
  units: "pm/V"
  range: {wavelength_um: [10.6, 10.6], temperature_c: not_found}
  check: "Table V: d36(CuGaS2)/d36(GaAs) = 0.108 ± 15%; experimental coherence length lc = 57.7 µm (calc 55.6 µm)"
  note: "Measured by thin-wedge SHG relative to d36(GaAs) at 10.6 µm. Absolute value is 14.5 pm/V based on Boyd 1971 scale (or ~9.1 pm/V on modern Shoji 1997 scale where d36(GaAs) = 84 pm/V). Kleinman symmetry assumed (d14 = d36)."

