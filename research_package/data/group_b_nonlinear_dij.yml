- material: GaS
  quantity: d_ij
  axis: "-"
  file: 10.1016_j.pquantelec.2015.04.001.pdf
  pdf_page: 30
  where: "p. 29, Section 5, text on GaS"
  formula: "d_ij ≡ 0 (by inversion symmetry)"
  values: {point_group: "6/mmm", all_dij: 0.0}
  units: "pm/V"
  range: {wavelength_um: not_found, temperature_c: not_found}
  check: "Petrov 2015 p. 29: centrosymmetric parent compound GaS with D6h / P6_3/mmc space group"
  note: "Bulk crystal gallium sulfide (GaS) is centrosymmetric (point group 6/mmm / D6h); all second-order nonlinear coefficients are identically zero by Neumann's principle."

- material: AlN
  quantity: d_ij
  axis: "-"
  file: 10.1103-physrevb.57.3905.pdf
  pdf_page: 10
  where: "Table V, column 'AlN Expt.'"
  formula: "d_ij = (1/2)·χ_ijk"
  values: {point_group: "6mm", d33: -6.3, d31: "< 0.25"}
  units: "pm/V"
  range: {wavelength_um: [1.064, 1.064], temperature_c: not_found}
  check: "Table V: χ333 = -12.6 ± 7 pm/V, |χ311| < 0.5 pm/V (Fujii et al. 1982)"
  note: "Experimental values from Fujii et al. (1982) at 1064 nm; Pernice et al. (2012) in 2019_Lu_...pdf report |χ(2)| = 4.7 pm/V (d_eff ≈ 2.35 pm/V) at 1550 nm. Kleinman symmetry: not assumed in calculation, but d15 ≈ d31 in transparent regime."

- material: SiC
