# Comprehensive Second-Order Nonlinear Optical Tensors (d_ij in pm/V)
# Standalone Research Package: Expanded to 70 Crystals
#
# Contracted index notation: 1=xx, 2=yy, 3=zz, 4=yz, 5=xz, 6=xy.
# Symmetry classes (Point Groups):
#   -43m: d14 = d25 = d36
#   -42m: d36, d14=d25 (=d36 by Kleinman)
#   3m:   d33, d31=d32=d15=d24, d22=-d21=-d16
#   6mm:  d33, d31=d32, d15=d24
#   mm2:  d31, d32, d33, d15, d24
#   32:   d11=-d12=-d26, d14=-d25
#   -62m: d22=-d21=-d16
#   m:    10 independent elements in dielectric principal frame
#   2:    8 independent elements in principal frame

