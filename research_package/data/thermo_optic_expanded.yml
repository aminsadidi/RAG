# Extended Thermo-Optic Models for Nonlinear Optical Crystals (Standalone Research Package)
#
# Form definitions:
#   "kato":  dn/dT = Σ c·λ^p × 10⁻⁵ /°C, constant in T, Δn = (T − t0)·dn/dT; pieces cover wavelength ranges.
#   "ghosh": 2n·dn/dT = G·R + H·R², R = λ²/(λ² − λig²), G and H in 10⁻⁶ /°C (Ghosh 1992 / 1995).
#   "gayer": Sellmeier with quadratic temperature factor f = (T − t0)·(T + t0 + 546.32) (Gayer 2008/2010, Dolev 2009).

