# The papers' PDFs, as static assets of a Worker that has no public address (workers_dev
# and preview URLs off): only the site (web/) reaches it, through a service binding, after
# its password check. Deployed from Colab (notebooks/colab_site.ipynb), which copies the
# PDFs into ./pdfs first; a deploy with an empty ./pdfs would remove them from the site.
name = "matrag-pdfs"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./pdfs"
binding = "ASSETS"
